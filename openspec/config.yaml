schema: spec-driven

# MAINTAINERS: This context MUST mirror AGENTS.md and CODE_STANDARDS.md.
# Keep them in sync in the same change.
context: |
  PROJECT:
  Am I Underpaid & Benchmark My Role repository. Dual-tenant, SSR platform.

  TECH STACK:
  Nuxt 4 (Nitro), Vue 3 (Composition API, `<script setup lang="ts">`), Tailwind CSS v4, Firebase (Firestore, Auth, vuefire, firebase-admin), TypeScript (Strict), Vitest.

  ARCHITECTURE & SEPARATION OF CONCERNS:
  - Composables: `~/composables/` for reusable business logic.
  - State: `useState()` for global state (No Pinia/Vuex).
  - Auth Reactivity: ALWAYS use Vuefire's `useCurrentUser()`. NEVER use `useFirebaseAuth()?.currentUser` for UI reactivity.
  - Server API: `~/server/api/`, authenticated endpoints must verify Firebase token.

  ENFORCED CONVENTIONS:
  - Base UI components prefixed with `AmI` (e.g., `AmIButton`). Modals with `Modal`, Toasts with `Toast`.
  - i18n required everywhere visual (except `~/pages/admin/`).

  DEFINITION OF A SUCCESSFUL CHANGE:
  - Code changes MUST include corresponding tests.
  - Unit tests strictly required for new core utilities (`~/utils/`) and composables (`~/composables/`) in adjacent `tests/` directories.
  - All changes MUST pass the test suite (`pnpm vitest run`) and standard build steps.

  VERIFY BEFORE RECOMMENDING (CODE_STANDARDS.md §10):
  - Before proposing anything irreversible, environment-dependent, or that flips a failure mode from silent to loud (or vice versa), verify the real current state — don't assume it.
  - The e2e/Playwright suite uses mocked endpoints, not live ones; never propose otherwise without explicit current instruction.

rules:
  proposal:
    - Include clear Why, What, Scope, and Non-goals sections.
    - Do not propose new runtime dependencies without explicit justification.
  specs:
    - Express requirements as MUST / SHOULD.
    - Detail exact deltas (ADDED/MODIFIED/REMOVED) and Given/When/Then scenarios.
  design:
    - Describe the architecture layer by layer for new changes.
  tasks:
    - Break implementation down into actionable, sequential checkboxes.
    - Name concrete repo-relative files.
    - When enforcement is per-file across a directory/glob (e.g. lifting a coverage exemption, tightening a lint rule), enumerate every file the real directory/glob currently matches — not a representative sample — before scoping tasks.
    - Include test authoring in the same task step as the feature code.
    - The final task MUST be a gate check task (e.g., "Run local verification `pnpm vitest run`").
    - Any task that is irreversible (data deletion/migration), flips a failure mode from silent to loud, or depends on infrastructure specifics (hosting platform, trusted proxy headers, deployed env vars) MUST be preceded by an explicit verification/pre-flight task that confirms the real current state before the risky task runs.
